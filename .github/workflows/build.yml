name: build-apk
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fonte Manrope (OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -sfL -o app/src/main/res/font/manrope.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          ls -la app/src/main/res/font
      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee $RUNNER_TEMP/build.log
      - name: Publish result to branch
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/out
          cp $RUNNER_TEMP/build.log $RUNNER_TEMP/out/build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD" $RUNNER_TEMP/build.log > $RUNNER_TEMP/out/errors.txt || true
          cp app/build/outputs/apk/release/*.apk $RUNNER_TEMP/out/Cotista.apk 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }}" > $RUNNER_TEMP/out/commit.txt
          cd $RUNNER_TEMP/out
          git init -q -b build-out
          git config user.email bot@users.noreply.github.com; git config user.name bot
          git add -A; git commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-out
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/out/Cotista.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cotista (build ${{ github.run_number }})
          body: APK de teste do Cotista. Baixe o arquivo Cotista.apk abaixo e instale no Android.
          files: ${{ runner.temp }}/out/Cotista.apk
          make_latest: true

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador + capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/shots.sh
      - name: Publicar capturas
        if: always()
        run: |
          mkdir -p shots; cd shots
          git init -q -b shots-out
          git config user.email bot@users.noreply.github.com; git config user.name bot
          git add -A; git commit -qm "shots ${{ github.run_number }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-out
