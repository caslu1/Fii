name: build-apk
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Cotista.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Cotista-apk
          path: out/Cotista.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Cotista ${{ github.run_number }}
          files: out/Cotista.apk
          make_latest: true
