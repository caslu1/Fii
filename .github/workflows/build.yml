name: build-apk
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee $RUNNER_TEMP/build.log
      - name: Publish result to branch
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/out
          cp $RUNNER_TEMP/build.log $RUNNER_TEMP/out/build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD" $RUNNER_TEMP/build.log > $RUNNER_TEMP/out/errors.txt || true
          cp app/build/outputs/apk/release/*.apk $RUNNER_TEMP/out/Cotista.apk 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }}" > $RUNNER_TEMP/out/commit.txt
          cd $RUNNER_TEMP/out
          git init -q -b build-out
          git config user.email bot@users.noreply.github.com; git config user.name bot
          git add -A; git commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-out
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cotista (build ${{ github.run_number }})
          body: APK de teste do Cotista. Baixe o arquivo Cotista.apk abaixo e instale no Android.
          files: ${{ runner.temp }}/out/Cotista.apk
          make_latest: true
