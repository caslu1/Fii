name: probe-data-sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CVM cabeçalhos completos
        run: |
          exec >> $GITHUB_WORKSPACE/../probe.txt 2>&1
          curl -s -o cvm.zip "https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_2026.zip"
          unzip -o -q cvm.zip -d cvm
          for f in cvm/*.csv; do
            echo "== $f"
            head -1 "$f" | iconv -f latin1 -t utf8 | tr ';' '\n' | nl
            echo "-- MXRF (último)"
            grep -a "97.521.225" "$f" | tail -1 | iconv -f latin1 -t utf8 | tr ';' '\n' | nl
            echo "-- HGLG (último)"
            grep -a "11.728.688" "$f" | tail -1 | iconv -f latin1 -t utf8 | tr ';' '\n' | nl
          done
      - name: FNET tipos de documento de um fundo
        run: |
          exec >> $GITHUB_WORKSPACE/../probe.txt 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          B="https://fnet.bmfbovespa.com.br/fnet/publico"
          echo "--- todos os docs MXRF"
          curl -s -A "$UA" -H "X-Requested-With: XMLHttpRequest" "$B/pesquisarGerenciadorDocumentosDados?d=0&s=0&l=40&o%5B0%5D%5BdataEntrega%5D=desc&tipoFundo=1&cnpjFundo=97521225000125" > all.json
          python3 -c "
          import json; d=json.load(open('all.json'))
          print('total', d.get('recordsTotal'))
          for x in d['data']: print(x['id'], '|', x.get('categoriaDocumento'), '|', x.get('tipoDocumento'), '|', x.get('especieDocumento'), '|', x.get('dataReferencia'), '|', x.get('dataEntrega'), '|', x.get('formatoDataReferencia'))
          "
          for c in 7 6 3; do
            echo "--- categoria $c"
            curl -s -A "$UA" -H "X-Requested-With: XMLHttpRequest" "$B/pesquisarGerenciadorDocumentosDados?d=0&s=0&l=5&o%5B0%5D%5BdataEntrega%5D=desc&tipoFundo=1&idCategoriaDocumento=$c&cnpjFundo=97521225000125" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          for x in d['data']: print(x['id'], '|', x.get('categoriaDocumento'), '|', x.get('tipoDocumento'), '|', x.get('dataReferencia'))
          "
          done
          echo "--- tipos para categoria 7"
          curl -s -A "$UA" -H "X-Requested-With: XMLHttpRequest" "$B/listarTodosTiposPorCategoriaETipoFundo?idTipoFundo=1&idCategoria=7" | head -c 2000; echo
          ID=$(python3 -c "
          import json; d=json.load(open('all.json'))
          for x in d['data']:
            if 'Gerencial' in (x.get('tipoDocumento') or ''): print(x['id']); break
          ")
          echo "--- relatorio gerencial id=$ID"
          curl -s -A "$UA" -D h.txt -o rg.bin "$B/downloadDocumento?id=$ID"; cat h.txt; ls -la rg.bin; head -c 120 rg.bin | xxd | head -4
          curl -s -A "$UA" -D h2.txt -o rg2.bin "$B/exibirDocumento?id=$ID&cvm=true"; cat h2.txt; head -c 120 rg2.bin | xxd | head -4
      - name: Save results
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email bot@users.noreply.github.com; git config user.name bot
          git checkout --orphan probe-out
          git rm -rfq . || true
          cp ../probe.txt probe.txt
          git add probe.txt; git commit -qm probe
          git push -f origin probe-out
